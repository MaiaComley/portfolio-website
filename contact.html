<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Maia Comley</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── PALETTE ── */
  :root {
    --bg: #FFFFFF; --ink: #0A0A0A; --muted: #888; --rule: #E8E8E8;
    --surface: #F2F2F2; --accent: #0A0A0A;
  }
  html.p-compl  { --bg:#F56200; --ink:#FFFFFF; --muted:rgba(255,255,255,0.65); --rule:rgba(255,255,255,0.22); --surface:#E05800; --accent:#0D46E7; }
  html.p-analog { --bg:#F5007A; --ink:#FFFFFF; --muted:rgba(255,255,255,0.65); --rule:rgba(255,255,255,0.22); --surface:#D4006A; --accent:#F57A00; }

  html.p-compl .nav-contact  { background: #0D46E7; color: #fff !important; }
  html.p-analog .nav-contact { background: #F57A00; color: #fff !important; }

  html, body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, sans-serif;
    height: 100%; overflow: hidden;
    transition: background 0.55s ease, color 0.55s ease;
  }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 28px 64px;
    display: flex; align-items: center; justify-content: space-between;
    transition: background 0.55s ease, border-color 0.3s;
  }
  .nav-name {
    font-size: 0.68rem; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--ink); text-decoration: none;
    line-height: 1.3; transition: color 0.55s;
  }
  .nav-links { display: flex; gap: 36px; list-style: none; align-items: center; }
  .nav-links a {
    font-size: 0.68rem; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); text-decoration: none;
    transition: color 0.2s;
  }
  .nav-links a.active, .nav-links a:hover { color: var(--ink); }
  .nav-contact {
    background: var(--ink); color: var(--bg) !important;
    border-radius: 5px; padding: 8px 20px;
    transition: background 0.55s, color 0.55s, opacity 0.2s;
  }
  .nav-contact:hover { opacity: 0.82; }

  /* ── LAYOUT ── */
  .page {
    height: 100vh; display: flex; flex-direction: column;
    padding-top: 80px;
  }
  .content {
    flex: 1; display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 0;
    max-width: 1100px; width: 100%; margin: 0 auto;
    padding: 0 64px 60px;
    align-items: center;
  }

  /* ── LEFT ── */
  .left { padding-right: 72px; }
  .greeting {
    font-size: clamp(2.8rem, 5vw, 4.5rem);
    font-weight: 300; letter-spacing: -0.04em; line-height: 0.95;
    color: var(--ink); margin-bottom: 20px;
    transition: color 0.55s;
  }
  .tagline {
    font-size: 0.95rem; color: var(--muted); line-height: 1.6;
    max-width: 320px; margin-bottom: 40px;
    transition: color 0.55s;
  }
  .contact-links { display: flex; flex-direction: column; gap: 12px; }
  .contact-link {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 0.72rem; font-weight: 500; letter-spacing: 0.05em;
    text-transform: uppercase; text-decoration: none;
    color: var(--ink); opacity: 0.7;
    transition: opacity 0.2s, color 0.55s;
  }
  .contact-link:hover { opacity: 1; }
  .link-icon {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--rule); display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: border-color 0.55s, background 0.2s;
  }
  .contact-link:hover .link-icon { background: var(--surface); }
  .link-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.5; }

  .left-rule {
    width: 1px; height: 100%; background: var(--rule);
    position: absolute; right: 0; top: 0;
    transition: background 0.55s;
  }
  .left { position: relative; }

  /* ── RIGHT (photo) ── */
  .right { padding-left: 72px; display: flex; align-items: center; justify-content: center; }
  .contact-photo {
    width: 300px; height: 420px; border-radius: 18px; overflow: hidden; flex-shrink: 0;
  }
  .contact-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }

  /* ── SPACE PROMPT ── */
  .space-prompt {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: var(--bg); border: 1px solid var(--rule);
    border-radius: 5px; padding: 10px 20px;
    font-size: 0.62rem; font-weight: 400; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); white-space: nowrap;
    z-index: 200;
    transition: opacity 0.4s, background 0.55s, border-color 0.55s;
  }
  .space-prompt.hidden { opacity: 0; pointer-events: none; }
  .space-key {
    background: var(--ink); color: var(--bg);
    border-radius: 3px; padding: 2px 10px;
    font-size: 0.6rem; font-weight: 600; letter-spacing: 0.06em;
    transition: background 0.55s, color 0.55s;
  }

  /* ── RESPONSIVE, medium ── */
  @media (max-width: 900px) {
    .content { padding: 0 40px; }
    .left { padding-right: 40px; }
    .right { padding-left: 40px; }
    .greeting { font-size: clamp(2rem, 4.5vw, 3.5rem); }
    .tagline { margin-bottom: 28px; }
    .contact-links { gap: 8px; }
    .contact-link { font-size: 0.68rem; }
    .field textarea { height: 88px; }
    .field.full { margin-bottom: 12px; }
    .form-label { margin-bottom: 16px; }
  }

  /* ── RESPONSIVE, mobile ── */
  @media (max-width: 768px) {
    html, body { overflow: auto; }
    .page { height: auto; padding-top: 64px; }

    /* Nav */
    nav { padding: 16px 20px; }
    .nav-links { gap: 14px; }
    .nav-links a { font-size: 0.62rem; letter-spacing: 0.05em; }
    .nav-contact { padding: 6px 12px; font-size: 0.62rem; }

    /* Layout */
    .content { grid-template-columns: 1fr; padding: 28px 20px 48px; gap: 36px; }
    .left { padding-right: 0; }
    .left-rule { display: none; }
    .right { padding-left: 0; }
    .greeting { font-size: clamp(1.8rem, 8vw, 2.8rem); }
    .tagline { font-size: 0.9rem; }

    /* Form */
    .form-row { grid-template-columns: 1fr; }

    /* Space prompt */
    .space-prompt { font-size: 0.6rem; padding: 8px 14px; bottom: 16px; }
  }
</style>
</head>

<div class="space-prompt" id="spacePrompt">
  Press <span class="space-key">SPACE</span> to select your theme
</div>

<script>
  // Palette
  const palettes = ['p-compl', 'p-analog'];
  let idx = -1;
  const sp = document.getElementById('spacePrompt');
  function applyPalette(i) {
    document.documentElement.classList.remove('p-compl', 'p-analog');
    if (i >= 0) { document.documentElement.classList.add(palettes[i]); localStorage.setItem('palette', palettes[i]); }
    else { localStorage.removeItem('palette'); }
  }
  const saved = localStorage.getItem('palette');
  if (saved) { idx = palettes.indexOf(saved); if (idx > -1) { applyPalette(idx); sp.classList.add('hidden'); } }
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target === document.body) {
      e.preventDefault();
      idx = idx >= palettes.length - 1 ? -1 : idx + 1;
      applyPalette(idx);
    }
  });


</script>
